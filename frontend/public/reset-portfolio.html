<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>重置组合配置中枢本地缓存</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(520px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: white;
        box-shadow: 0 10px 30px rgb(15 23 42 / 0.08);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      p {
        margin: 8px 0;
        color: #475569;
        line-height: 1.7;
        font-size: 14px;
      }
      button,
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 16px;
        padding: 9px 14px;
        border-radius: 8px;
        border: 0;
        background: #4f46e5;
        color: white;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      code {
        color: #4f46e5;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>已清理组合配置中枢本地缓存</h1>
      <p id="status">正在清理 Edge/浏览器里保存的 portfolio-center 草稿、代码簿、收益簿、板块映射和 Claude 审阅缓存。</p>
      <p>这只影响当前浏览器的 <code>localhost:5173</code> 本地缓存，不会删除数据库里已保存的持仓快照。</p>
      <a id="back" href="/portfolio-center">返回组合配置中枢</a>
    </main>
    <script>
      const keys = [
        "portfolio-center-draft-v1",
        "portfolio-center-fund-code-book-v1",
        "portfolio-center-profit-book-v1",
        "portfolio-center-flow-sector-book-v1",
        "portfolio-center-backtest-a-v1",
        "portfolio-center-claude-review-v1"
      ];

      for (const key of keys) {
        localStorage.removeItem(key);
        sessionStorage.removeItem(key);
      }

      document.getElementById("status").textContent = `已清理 ${keys.length} 个本地缓存项，2 秒后返回组合配置中枢。`;
      window.setTimeout(() => {
        window.location.href = "/portfolio-center?reset=" + Date.now();
      }, 2000);
    </script>
  </body>
</html>
